<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;

        font-family: 'Poppins', sans-serif;
    }

    .container {
        width: 100%;
        max-width: 500px;
    }

    h2 {
        text-align: center;
        margin-bottom: 22px;

        font-family: 'Montserrat', sans-serif;
        font-size: 24px;
        font-weight: 700;

        color: #172554;
    }

    /* Registration card */

    #regform {
        position: relative;

        width: 100%;
        padding: 30px 35px;

        background: rgba(255, 255, 255, 0.94);

        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 20px;

        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);

        backdrop-filter: blur(10px);
    }

    .form-group {
        margin-bottom: 17px;
    }

    label {
        display: block;

        margin-bottom: 7px;

        font-size: 13px;
        font-weight: 600;

        color: #030141;
    }

    input,
    textarea {
        width: 100%;

        padding: 10px 13px;

        font-family: 'Poppins', sans-serif;
        font-size: 13px;

        color: black;


        border: 1px solid #cbd5e1;
        border-radius: 10px;

        transition: 0.25s ease;
    }

    input {
        height: 42px;
    }

    textarea {
        min-height: 75px;
        resize: vertical;
    }

    input:focus,
    textarea:focus {
        outline: none;

        background: white;

        border-color: #6366f1;

    }

    input::placeholder,
    textarea::placeholder {
        color: gray;
        font-weight: 200;
    }

    .uerror,
    .failuremsg,
    .passwordmsg {
        color: #dc2626;
        font-size: 11px;
        font-weight: 500;
        margin: 5px 0;
    }

    .uerror {
        text-align: center;
        margin-bottom: 12px;
    }

    .reg {
        width: 100%;
        height: 44px;
        margin-top: 10px;
        border: none;
        border-radius: 10px;
        font-family: 'Poppins', sans-serif;
        font-size: 14px;
        font-weight: 600;
        background-color: blue;
        color: white;
        cursor: pointer;
        transition: 0.25s ease;
    }

    .reg:hover {
        transform: translateY(-2px);

        box-shadow:
            0 8px 18px rgba(79, 70, 229, 0.25);
    }

    .reg:active {
        transform: translateY(0);
    }

    .login-text {
        text-align: center;

        margin-top: 18px;

        font-size: 12px;
        color: #64748b;
    }

    .login-text a {
        color: #4f46e5;
        font-weight: 600;
        text-decoration: none;
    }

    .login-text a:hover {
        text-decoration: underline;
    }

    /* Success message */

    h5 {
        margin-top: 15px;

        text-align: center;

        font-size: 12px;
        font-weight: 600;

        color: #16a34a;
    }

</style>

</head>

<body>

<div class="container">

    <h2>GreenField College of Engineering</h2>

    <form id="regform" action="/register" method="post">

        <p class="uerror">{{uerror}}</p>

        <div class="form-group">
            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Must contain 8 characters"
                required
            >

            <p class="failuremsg">{{failuremsg}}</p>
        </div>


        <div class="form-group">
            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="example01@gmail.com"
                required
            >
        </div>


        <div class="form-group">
            <label for="contact">Contact No</label>

            <input
                type="tel"
                id="contact"
                name="contact"
                placeholder="Enter your contact number"
                required
            >
        </div>


        <div class="form-group">
            <label for="clg">College Name</label>

            <textarea
                id="clg"
                name="clg"
                rows="2"
                placeholder="Enter your college name"
            ></textarea>
        </div>


        <div class="form-group">
            <label for="dept">Department</label>

            <input
                type="text"
                id="dept"
                name="dept"
                placeholder="Enter your department"
                required
            >
        </div>


        <div class="form-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <p class="passwordmsg">{{passwordmsg}}</p>
        </div>


        <button type="submit" class="reg">
            Register
        </button>


        <p class="login-text">
            Already have an account?
            <a href="/login">Login</a>
        </p>


        <h5>{{successmsg}}</h5>

    </form>

</div>

</body>

</html>
