<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Success</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        font-family: 'Poppins', sans-serif;

    }

    #loader { 
        border: 5px solid #f3f3f3; 
        border-top: 5px solid #5cbeff; 
        border-radius: 50%; 
        width: 50px; 
        height: 50px; 
        animation: spin 2s linear 2; 
        margin-left: 50px; 
        margin-top: 20px; 
    }

    @keyframes spin {

        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }

    }

    /* Success content */

    #content {
        display: none;

        width: 100%;
        max-width: 430px;

        padding: 45px 35px;

        text-align: center;

        background: rgba(255, 255, 255, 0.94);

        border: 1px solid rgba(255, 255, 255, 0.8);

        border-radius: 24px;

        box-shadow:
            0 20px 50px rgba(15, 23, 42, 0.12);

        backdrop-filter: blur(10px);

        animation: showCard 0.5s ease;
    }

    @keyframes showCard {

        from {
            opacity: 0;
            transform: translateY(20px) scale(0.97);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

    }

    #content img {
        width: 90px;
        height: 90px;

        object-fit: contain;

        margin-bottom: 20px;

        animation: pop 0.5s ease 0.2s both;
    }

    @keyframes pop {

        0% {
            transform: scale(0);
        }

        70% {
            transform: scale(1.12);
        }

        100% {
            transform: scale(1);
        }

    }

    /* Heading */

    #content h2 {
        font-family: 'Montserrat', sans-serif;

        font-size: 25px;
        font-weight: 700;

        color: #16a34a;

        margin-bottom: 8px;
    }

    #content p {
        position: static;

        font-size: 13px;

        color: #64748b;

        margin-bottom: 25px;
    }

    /* Receipt button */

    #btn {
        width: 100%;
        height: 45px;

        margin: 0;

        border: none;
        border-radius: 10px;
        background-color: blue;

        color: white;

        font-family: 'Poppins', sans-serif;

        font-size: 13px;
        font-weight: 600;

        cursor: pointer;

        transition: 0.25s ease;
    }

    #btn:hover {
        transform: translateY(-2px);

        box-shadow:
            0 8px 18px rgba(79, 70, 229, 0.25);
    }

    #btn:active {
        transform: translateY(0);
    }

    #btn a {
        display: flex;

        width: 100%;
        height: 100%;

        align-items: center;
        justify-content: center;

        color: white;
        text-decoration: none;
    }

    /* Mobile */

    @media (max-width: 500px) {

        body {
            padding: 20px;
        }

        #content {
            padding: 35px 25px;
        }

        #content h2 {
            font-size: 22px;
        }

        #content img {
            width: 75px;
            height: 75px;
        }

    }

</style>

</head>

<body>

<!-- Loading animation -->
<div id="loader"></div>


<!-- Payment success -->
<div id="content">

    <img src="/static/tick.png" alt="Payment successful">

    <h2>Payment Successful!</h2>

    <p>
        Your event registration has been completed successfully.
    </p>

    <button id="btn">
        <a href="/receiptdownload">
            Download Receipt
        </a>
    </button>

</div>


<script>

    window.onload = function () {

        setTimeout(function () {

            document.getElementById('loader').style.display = 'none';

            document.getElementById('content').style.display = 'block';

        }, 2000);

    };

</script>
</body>

</html>
