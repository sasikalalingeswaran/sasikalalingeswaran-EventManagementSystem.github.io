<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Poppins', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
    }

    #form {
        width: 430px;
        margin: 0;
        padding: 35px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 22px;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(10px);
    }

    .title {
        text-align: center;
        margin-bottom: 28px;
    }

    .title h2 {
        font-family: 'Montserrat', sans-serif;
        font-size: 25px;
        font-weight: 700;
        color: #1e293b;
        margin-bottom: 6px;
    }

    .title p {
        font-size: 12px;
        color: #64748b;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-size: 13px;
        font-weight: 600;
        color: rgb(3, 3, 92);
    }

    input[type="text"],
    #interest {
        width: 100%;
        height: 42px;
        padding: 0 13px;
        font-family: 'Poppins', sans-serif;
        font-size: 13px;
        border: 1px solid #cbd5e1;
        border-radius: 9px;
        transition: 0.25s ease;
    }

    input[type="text"]:focus,
    #interest:focus {
        outline: none;
        border-color: #6366f1;
        background-color: white;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    #recommendEvent {
        min-height: 20px;
        margin-top: 7px;
        margin-bottom: 5px;
        font-size: 11px;
        font-weight: 500;
        color: #6366f1;
    }

    .events-title {
        margin-top: 8px;
    }

    .events {
        max-height: 150px;
        overflow-y: auto;
        padding: 12px 14px;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
    }

    .event-option {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 7px 5px;
        font-size: 12px;
        font-weight: 400;
        cursor: pointer;
    }

    .event-option input {
        width: 15px;
        height: 15px;
        accent-color: #6366f1;
        cursor: pointer;
    }

    #reg {
        width: 40%;
        height: 44px;
        margin-top: 22px;
        padding: 8px;
        border: none;
        border-radius: 10px;
        font-family: 'Poppins', sans-serif;
        font-size: 14px;
        font-weight: 600;
        color: white;
        background: rgb(4, 91, 161);
        cursor: pointer;
        transition: 0.25s ease;
    }

    #reg:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(2, 47, 85, 0.25);
    }

    #reg:active {
        transform: translateY(0);
    }

</style>

</head>

<body>

<form id="form" method="post" action="/userevents">

    <div class="title">
        <h2>Event Registration</h2>
    </div>

    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
    </div>

    <div class="form-group">
        <label for="dept">Department</label>
        <input type="text" id="dept" name="dept" placeholder="Enter your department" required>
    </div>

    <div class="form-group">
        <label for="interest">Area of Interest</label>

        <select id="interest" name="interest" onchange="displayevents()" required>
            <option value="">Select your interest</option>
            <option value="communication">Communication</option>
            <option value="computer knowledge">Computer Knowledge</option>
            <option value="coding skills">Coding Skills</option>
            <option value="web designing skills">Web Designing Skills</option>
        </select>

        <p id="recommendEvent"></p>
    </div>

    <div class="form-group">
        <label class="events-title">Select Event</label>
        <div class="events">
            {% for e in event_names %}
            <label class="event-option">
                <input type="checkbox" name="selectedevent" value="{{ e.eventname }}">
                <span>{{ e.eventname }}</span>
            </label>
            {% endfor %}
        </div>
    </div>

    <button type="submit" id="reg">
        Pay
    </button>
</form>
<script>
    function displayevents() {
        const interest = document.getElementById('interest').value;
        const recommendEvent = document.getElementById('recommendEvent');
        if (interest === 'communication') {
            recommendEvent.innerText = '* Recommended event: Power Point Presentation';
        } else if (interest === 'computer knowledge') {
            recommendEvent.innerText = '* Recommended event: Quiz';
        } else if (interest === 'coding skills') {
            recommendEvent.innerText = '* Recommended event: Debugging';
        } else if (interest === 'web designing skills') {
            recommendEvent.innerText = '* Recommended event: Logo Designing';
        } else {
            recommendEvent.innerText = '';
        }
    }
</script>

</body>
</html>
