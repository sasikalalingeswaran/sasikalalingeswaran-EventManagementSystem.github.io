<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="/static/frameset.css">
</head>

<body>

    <form id="form" action="/addevents" method="post">
        <div class="form-group">
            <label for="eventname">Event Name:</label>
            <input type="text" name="eventname" id="eventname">
        </div>
        <div class="form-group">
            <label for="eventdate">Event Date:</label>
            <input type="date" name="date" id="eventdate">
        </div>
        <div class="form-group">
            <label for="duration">Duration:</label>
            <input type="text" name="time" id="duration">
        </div>
        <div class="form-group">
            <label for="participants">No. of Participants:</label>
            <input type="number" name="part" id="participants">
        </div>
        <div class="form-group">
            <label for="topics">Topics:</label>
            <textarea rows="3" name="topics" id="topics"></textarea>
        </div>
        <div class="form-group category-group">
            <label>Category:</label>
            <div class="categories">
                <label>
                    <input type="checkbox" name="category" value="Tech">
                    Tech
                </label>
                <label>
                    <input type="checkbox" name="category" value="NonTech">
                    NonTech
                </label>
            </div>
        </div>
        <input type="submit" id="add" value="Add">
    </form>
</body>
</html>
